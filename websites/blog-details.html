<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Details - Andi Yusdar Al Imran</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="apple-touch-icon" href="assets/favicon.svg">

    <style>
        :root {
            --bg: #121212;
            --card: #1A1A1A;
            --secondary: #282828;
            --primary: #1DB954;
            --primary-fg: #000000;
            --fg: #FFFFFF;
            --muted-fg: #A7A7A7;
            --border: #3E3E3E;
            --font-display: 'Syne', sans-serif;
            --font-body: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --radius-card: 10px;
            --radius-pill: 9999px;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--fg);
            overflow-x: hidden;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        ::selection {
            background: rgba(29, 185, 84, 0.25);
            color: var(--fg);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--radius-pill); }

        a { color: inherit; text-decoration: none; }

        /* ========================================
           NAVIGATION
           ======================================== */
        .nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 50;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .nav-inner {
            max-width: 1152px;
            margin: 0 auto;
            padding: 0 32px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 500;
            color: var(--fg);
            transition: color 0.3s;
        }

        .nav-logo span {
            color: var(--primary);
        }

        .nav-logo:hover {
            color: var(--primary);
        }

        .nav-back {
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 400;
            color: var(--muted-fg);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s;
        }

        .nav-back:hover {
            color: var(--primary);
        }

        .nav-back svg {
            width: 16px;
            height: 16px;
            transition: transform 0.3s;
        }

        .nav-back:hover svg {
            transform: translateX(-3px);
        }

        /* ========================================
           ARTICLE HEADER
           ======================================== */
        .article-header {
            max-width: 900px;
            margin: 0 auto;
            padding: 140px 32px 40px;
            text-align: center;
        }

        .article-meta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .article-meta .dot {
            opacity: 0.4;
        }

        .article-title {
            font-family: var(--font-display);
            font-size: clamp(28px, 5vw, 48px);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .article-tags {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .article-tag {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            color: var(--primary);
            background: rgba(29, 185, 84, 0.08);
            border: 1px solid rgba(29, 185, 84, 0.15);
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* ========================================
           ARTICLE CONTENT CARD
           ======================================== */
        .article-body {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 32px 80px;
        }

        .article-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 48px;
            position: relative;
            overflow: hidden;
        }

        .article-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        /* ========================================
           BLOG CONTENT STYLING (matches index.html tokens)
           ======================================== */
        .blog-content h1 {
            font-family: var(--font-display);
            font-size: clamp(24px, 3vw, 32px);
            font-weight: 700;
            color: var(--fg);
            margin-bottom: 12px;
            letter-spacing: -0.01em;
        }

        .blog-content h2 {
            font-family: var(--font-display);
            font-size: clamp(20px, 2.5vw, 26px);
            font-weight: 600;
            color: var(--fg);
            margin-top: 40px;
            margin-bottom: 16px;
            letter-spacing: -0.01em;
        }

        .blog-content h3 {
            font-family: var(--font-display);
            font-size: clamp(18px, 2vw, 22px);
            font-weight: 600;
            color: var(--fg);
            margin-top: 32px;
            margin-bottom: 12px;
        }

        .blog-content p {
            font-family: var(--font-body);
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 16px;
            color: var(--muted-fg);
        }

        .blog-content strong {
            color: var(--fg);
            font-weight: 500;
        }

        .blog-content ul,
        .blog-content ol {
            margin-left: 20px;
            margin-bottom: 16px;
            line-height: 1.8;
        }

        .blog-content li {
            margin-bottom: 8px;
            color: var(--muted-fg);
            font-size: 16px;
        }

        .blog-content li strong {
            color: var(--fg);
        }

        .blog-content code {
            font-family: var(--font-mono);
            font-size: 14px;
            background: rgba(29, 185, 84, 0.08);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .blog-content pre {
            background: var(--secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 24px;
            overflow-x: auto;
            margin: 20px 0;
        }

        .blog-content pre code {
            background: transparent;
            padding: 0;
            font-size: 14px;
            line-height: 1.7;
            color: var(--muted-fg);
            display: block;
        }

        .blog-content img {
            width: 100%;
            border-radius: var(--radius-card);
            margin: 24px 0;
            border: 1px solid var(--border);
        }

        .blog-content .meta-info {
            display: none;
        }

        .blog-content .featured-image {
            display: none;
        }

        .blog-content .call-to-action {
            background: rgba(29, 185, 84, 0.06);
            border: 1px solid rgba(29, 185, 84, 0.15);
            border-radius: var(--radius-card);
            padding: 24px;
            margin-top: 32px;
            text-align: center;
        }

        .blog-content .call-to-action p {
            color: var(--muted-fg);
            margin-bottom: 12px;
        }

        .blog-content .call-to-action strong {
            color: var(--fg);
        }

        .blog-content .cta-button {
            display: inline-block;
            padding: 10px 24px;
            background: var(--primary);
            color: var(--primary-fg);
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 600;
            border-radius: var(--radius-card);
            transition: opacity 0.3s, transform 0.3s;
        }

        .blog-content .cta-button:hover {
            opacity: 0.85;
            transform: translateY(-2px);
        }

        /* ========================================
           LOADING & ERROR STATES
           ======================================== */
        .state-screen {
            max-width: 900px;
            margin: 0 auto;
            padding: 200px 32px;
            text-align: center;
        }

        .state-screen .icon {
            width: 48px;
            height: 48px;
            color: var(--primary);
            margin: 0 auto 16px;
        }

        .state-screen .icon.error {
            color: #F15E6C;
        }

        .state-screen p {
            font-family: var(--font-body);
            font-size: 16px;
            color: var(--muted-fg);
            margin-bottom: 16px;
        }

        .state-screen a {
            color: var(--primary);
            font-size: 14px;
            transition: opacity 0.3s;
        }

        .state-screen a:hover {
            opacity: 0.7;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner {
            animation: spin 1s linear infinite;
        }

        /* ========================================
           FOOTER
           ======================================== */
        .footer {
            border-top: 1px solid var(--border);
            padding: 32px;
            text-align: center;
        }

        .footer p {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--muted-fg);
            opacity: 0.5;
        }

        /* ========================================
           RESPONSIVE
           ======================================== */
        @media (max-width: 768px) {
            .nav-inner {
                padding: 0 20px;
            }

            .article-header {
                padding: 120px 20px 32px;
            }

            .article-body {
                padding: 0 20px 60px;
            }

            .article-card {
                padding: 28px 20px;
            }

            .blog-content pre {
                padding: 16px;
            }
        }

        @media (max-width: 480px) {
            .article-title {
                font-size: 24px;
            }

            .article-card {
                padding: 24px 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">Andi Yusdar <span>Al Imran</span></a>
            <a href="blog.html" class="nav-back">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                Kembali ke Blog
            </a>
        </div>
    </nav>

    <!-- Loading State -->
    <div id="loading" class="state-screen">
        <svg class="icon spinner" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        <p>Memuat artikel...</p>
    </div>

    <!-- Error State -->
    <div id="error" class="state-screen" style="display:none;">
        <svg class="icon error" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        <p>Artikel tidak ditemukan atau gagal dimuat.</p>
        <a href="blog.html">Kembali ke daftar blog</a>
    </div>

    <!-- Article -->
    <article id="article-container" style="display:none;">
        <header class="article-header">
            <div class="article-meta">
                <span id="post-date"></span>
                <span class="dot">&middot;</span>
                <span id="post-read-time"></span>
            </div>
            <h1 id="post-title" class="article-title"></h1>
            <div id="post-tags" class="article-tags"></div>
        </header>

        <div class="article-body">
            <div id="blog-content" class="article-card blog-content"></div>
        </div>
    </article>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Andi Yusdar Al Imran</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const blogId = urlParams.get('id');

            if (!blogId) {
                showError();
                return;
            }

            try {
                const response = await fetch('blogs.json');
                const data = await response.json();
                const post = data.posts.find(p => p.id == blogId);

                if (!post) {
                    showError();
                    return;
                }

                document.title = `${post.title} - Andi Yusdar Al Imran`;
                document.getElementById('post-date').textContent = formatDate(post.date);
                document.getElementById('post-read-time').textContent = post.readTime;
                document.getElementById('post-title').textContent = post.title;

                const tagsContainer = document.getElementById('post-tags');
                post.tags.forEach(tag => {
                    tagsContainer.innerHTML += `<span class="article-tag">${tag}</span>`;
                });

                const contentResponse = await fetch(post.contentPath);
                if (!contentResponse.ok) throw new Error('Failed to load content');

                const contentHTML = await contentResponse.text();
                document.getElementById('blog-content').innerHTML = contentHTML;

                document.getElementById('loading').style.display = 'none';
                document.getElementById('article-container').style.display = 'block';

            } catch (err) {
                console.error(err);
                showError();
            }
        });

        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
        }

        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('id-ID', options);
        }
    </script>
</body>

</html>
