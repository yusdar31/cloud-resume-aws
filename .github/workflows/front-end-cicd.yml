name: Deploy Cloud Resume to Server

on:
  push:
    branches:
      - main
    paths:
      - 'websites/blog-posts/**'
      - 'websites/blogs.json'

jobs:
  deploy:
    name: Deploy to Server
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy blog-posts dan blogs.json ke container
        run: |
          set -e
          CONTAINER="cloud-resume-web"
          WEBROOT="/usr/share/nginx/html"

          docker cp websites/blogs.json "$CONTAINER:$WEBROOT/blogs.json"

          for f in websites/blog-posts/*.html; do
            [ -f "$f" ] || continue
            docker cp "$f" "$CONTAINER:$WEBROOT/blog-posts/$(basename $f)"
          done

          echo "Deploy selesai: $(date)"

      - name: Verify deployment
        run: |
          sleep 2
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Verify gagal: HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Website OK: HTTP $HTTP_CODE"
